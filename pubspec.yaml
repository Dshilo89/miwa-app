name: miwa_app
description: "MIWA - Food Delivery & Donation Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.6
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.6

  # State Management
  provider: ^6.1.4

  # Routing
  go_router: ^14.8.1

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.10+1

  # Storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

